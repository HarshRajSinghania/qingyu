services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: qingyu
      POSTGRES_USER: qingyu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qingyu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingyu -d qingyu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qingyu_postgres:
